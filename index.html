<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FluxGroups - Premium Minecraft Hosting</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background: #0a0a0f;
            color: #fff;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #3B82F6, #EF4444);
            border-radius: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(10, 10, 20, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.15);
            padding: 10px 0 5px 0;
            text-align: center;
        }

        .nav-logo {
            font-size: 1.8rem;
            font-weight: 900;
        }
        .nav-logo .highlight {
            color: #F87171;
        }

        .nav-info {
            font-size: 0.7rem;
            color: #888;
            margin-top: 4px;
        }
        .nav-info .ip {
            color: #60A5FA;
        }
        .nav-info .divider {
            color: #444;
            margin: 0 8px;
        }
        .nav-info .highlight {
            color: #F87171;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            list-style: none;
            gap: 20px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #aaa;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 700;
            transition: 0.3s;
            padding: 4px 0;
            cursor: pointer;
        }
        .nav-links a:hover {
            color: #fff;
        }

        .discord-btn {
            background: linear-gradient(135deg, #5865F2, #4752c4);
            color: #fff;
            padding: 4px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.65rem;
            font-weight: 700;
            display: inline-block;
            margin-top: 6px;
            transition: 0.3s;
        }
        .discord-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.3);
        }

        /* ===== HERO ===== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 140px;
            padding-bottom: 60px;
            background: radial-gradient(ellipse at center, #0a0a1a, #050510);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .hero-3d-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .server-cube-3d {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            transform-style: preserve-3d;
            animation: spinCube 20s linear infinite;
        }

        @keyframes spinCube {
            0% {
                transform: translate(-50%, -50%) rotateX(0deg) rotateY(0deg);
            }
            100% {
                transform: translate(-50%, -50%) rotateX(360deg) rotateY(360deg);
            }
        }

        .cube-face {
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(59, 130, 246, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .front {
            transform: translate(-50%, -50%) translateZ(100px);
            background: rgba(59, 130, 246, 0.08);
        }
        .back {
            transform: translate(-50%, -50%) translateZ(-100px);
            background: rgba(239, 68, 68, 0.08);
        }
        .left {
            transform: translate(-50%, -50%) rotateY(-90deg) translateZ(100px);
            background: rgba(59, 130, 246, 0.06);
        }
        .right {
            transform: translate(-50%, -50%) rotateY(90deg) translateZ(100px);
            background: rgba(239, 68, 68, 0.06);
        }
        .top {
            transform: translate(-50%, -50%) rotateX(90deg) translateZ(100px);
            background: rgba(59, 130, 246, 0.08);
        }
        .bottom {
            transform: translate(-50%, -50%) rotateX(-90deg) translateZ(100px);
            background: rgba(239, 68, 68, 0.08);
        }

        .cube-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1), transparent);
            border-radius: 50%;
            filter: blur(50px);
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 0.5;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 1;
            }
        }

        .hero-content {
            z-index: 2;
            max-width: 800px;
            padding: 20px;
        }

        .hero-title {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .gradient-text {
            background: linear-gradient(135deg, #3B82F6, #EF4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 40px;
        }

        .hero-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-main {
            padding: 18px 50px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.2rem;
            transition: 0.3s;
            border: none;
            cursor: pointer;
            display: inline-block;
            min-width: 220px;
            font-family: 'Orbitron', sans-serif;
        }
        .btn-main:hover {
            transform: scale(1.05);
        }

        .btn-smp {
            background: linear-gradient(135deg, #3B82F6, #2563EB);
            color: #fff;
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.3);
        }
        .btn-smp:hover {
            box-shadow: 0 0 60px rgba(59, 130, 246, 0.5);
        }

        .btn-hosting {
            background: linear-gradient(135deg, #EF4444, #DC2626);
            color: #fff;
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.3);
        }
        .btn-hosting:hover {
            box-shadow: 0 0 60px rgba(239, 68, 68, 0.5);
        }

        /* ===== SECTIONS ===== */
        .section {
            display: none;
            padding: 100px 20px 60px;
            min-height: 100vh;
            background: #0a0a0f;
        }
        .section.active {
            display: block;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #3B82F6, #EF4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            transition: 0.3s;
            margin-bottom: 20px;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        /* ===== NAVIGATION TABS ===== */
        .smp-nav,
        .hosting-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        .smp-nav button,
        .hosting-nav button {
            padding: 12px 30px;
            border-radius: 50px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: transparent;
            color: #aaa;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .smp-nav button:hover,
        .smp-nav button.active,
        .hosting-nav button:hover,
        .hosting-nav button.active {
            border-color: #3B82F6;
            color: #fff;
            background: rgba(59, 130, 246, 0.1);
        }

        .smp-section,
        .hosting-section {
            display: none;
        }
        .smp-section.active,
        .hosting-section.active {
            display: block;
        }

        /* ===== MODEL CONTAINERS ===== */
        .model-3d-container {
            text-align: center;
            padding: 30px 0;
            position: relative;
            overflow: hidden;
        }

        .model-label {
            color: #60A5FA;
            font-size: 1rem;
            margin-top: 15px;
            letter-spacing: 2px;
        }

        /* ===== 2D ROTATING PLAYER ===== */
        .armor-stand-2d {
            width: 120px;
            height: 200px;
            margin: 0 auto;
            position: relative;
            animation: rotateModel 10s linear infinite;
        }

        @keyframes rotateModel {
            0% {
                transform: rotateY(0deg);
            }
            100% {
                transform: rotateY(360deg);
            }
        }

        .player-head {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background: #D4A574;
            border-radius: 4px;
            box-shadow: inset -4px -4px 0 #B8835A, inset 4px 4px 0 #E8C9A8;
            z-index: 10;
        }

        .helmet {
            position: absolute;
            top: -4px;
            left: -4px;
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #4A4A5A, #2A2A3A);
            border-radius: 4px;
            box-shadow: inset -4px -4px 0 #1A1A2A, inset 4px 4px 0 #6A6A7A, 0 0 20px rgba(59, 130, 246, 0.2);
        }

        .eyes {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 8px;
            display: flex;
            justify-content: space-between;
        }
        .eyes::before,
        .eyes::after {
            content: '';
            width: 6px;
            height: 6px;
            background: #1A3A5A;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }

        .mouth {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 3px;
            background: #8B5A3A;
            border-radius: 2px;
        }

        .player-body {
            position: absolute;
            top: 44px;
            left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 50px;
            background: #3A5A7A;
            border-radius: 4px;
            box-shadow: inset -4px -4px 0 #2A3A5A, inset 4px 4px 0 #5A7A9A;
        }

        .chestplate {
            position: absolute;
            top: -2px;
            left: -2px;
            width: 52px;
            height: 54px;
            background: linear-gradient(135deg, #4A5A7A, #2A3A5A);
            border-radius: 4px;
            box-shadow: inset -4px -4px 0 #1A2A4A, inset 4px 4px 0 #6A7A9A, 0 0 20px rgba(59, 130, 246, 0.1);
        }

        .player-arm-left {
            position: absolute;
            top: 46px;
            left: -14px;
            width: 12px;
            height: 44px;
            background: #3A5A7A;
            border-radius: 4px;
            box-shadow: inset -3px -3px 0 #2A3A5A, inset 3px 3px 0 #5A7A9A;
            transform: rotate(10deg);
            transform-origin: top center;
        }
        .player-arm-right {
            position: absolute;
            top: 46px;
            right: -14px;
            width: 12px;
            height: 44px;
            background: #3A5A7A;
            border-radius: 4px;
            box-shadow: inset -3px -3px 0 #2A3A5A, inset 3px 3px 0 #5A7A9A;
            transform: rotate(-10deg);
            transform-origin: top center;
        }
        .armor-arm {
            position: absolute;
            top: -2px;
            left: -2px;
            width: 16px;
            height: 48px;
            background: linear-gradient(135deg, #4A5A7A, #2A3A5A);
            border-radius: 4px;
            box-shadow: inset -3px -3px 0 #1A2A4A, inset 3px 3px 0 #6A7A9A;
        }

        .player-legs {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 44px;
            display: flex;
            justify-content: space-between;
            gap: 4px;
        }
        .player-leg {
            width: 16px;
            height: 44px;
            background: #2A4A6A;
            border-radius: 4px;
            box-shadow: inset -3px -3px 0 #1A2A4A, inset 3px 3px 0 #4A6A8A;
            position: relative;
        }
        .leggings {
            position: absolute;
            top: -2px;
            left: -2px;
            width: 20px;
            height: 30px;
            background: linear-gradient(135deg, #3A4A6A, #1A2A4A);
            border-radius: 4px;
            box-shadow: inset -3px -3px 0 #0A1A2A, inset 3px 3px 0 #5A6A8A;
        }
        .boot {
            position: absolute;
            bottom: 0;
            left: -2px;
            width: 20px;
            height: 12px;
            background: linear-gradient(135deg, #4A4A6A, #2A2A4A);
            border-radius: 4px;
            box-shadow: inset -3px -3px 0 #1A1A2A, inset 3px 3px 0 #6A6A8A;
        }

        .armor-glow-2d {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 220px;
            background: radial-gradient(ellipse, rgba(59, 130, 246, 0.12), transparent);
            border-radius: 50%;
            filter: blur(40px);
            animation: glowPulse 2s ease-in-out infinite;
            pointer-events: none;
        }

        /* ===== 2D ROTATING SHULKER ===== */
        .shulker-2d {
            width: 100px;
            height: 120px;
            margin: 0 auto;
            position: relative;
            animation: rotateModel 8s linear infinite;
        }

        .shulker-top {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 15px;
            background: #7A4A6A;
            border-radius: 4px 4px 0 0;
            box-shadow: inset -3px -3px 0 #4A2A3A, inset 3px 3px 0 #9A6A8A;
        }
        .shulker-body {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 65px;
            background: linear-gradient(135deg, #8A5A7A, #6A3A5A);
            border-radius: 8px;
            box-shadow: inset -5px -5px 0 #4A2A3A, inset 5px 5px 0 #AA7A9A;
        }
        .shulker-bottom {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 10px;
            background: #5A3A4A;
            border-radius: 0 0 6px 6px;
            box-shadow: inset -3px -3px 0 #3A1A2A, inset 3px 3px 0 #7A5A6A;
        }
        .shulker-eyes {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 15px;
            display: flex;
            justify-content: space-between;
        }
        .shulker-eyes::before,
        .shulker-eyes::after {
            content: '';
            width: 10px;
            height: 15px;
            background: #2A1A2A;
            border-radius: 50%;
            box-shadow: inset -2px -2px 0 #1A0A1A, 0 0 15px rgba(139, 92, 246, 0.3);
        }

        .shulker-glow-2d {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 140px;
            background: radial-gradient(ellipse, rgba(139, 92, 246, 0.12), transparent);
            border-radius: 50%;
            filter: blur(40px);
            animation: glowPulse 2s ease-in-out infinite;
            pointer-events: none;
        }

        /* ===== 2D ROTATING AMETHYST ===== */
        .amethyst-2d {
            width: 100px;
            height: 130px;
            margin: 0 auto;
            position: relative;
            animation: rotateModel 10s linear infinite;
        }

        .amethyst-crystal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 90px;
        }

        .crystal-point {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 30px solid #8B5CF6;
            filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.3));
        }
        .p1 {
            top: 0;
            left: 50%;
            transform: translateX(-50%) rotate(0deg);
            border-bottom-color: #A78BFA;
        }
        .p2 {
            top: 5px;
            left: 15%;
            transform: rotate(-30deg);
            border-bottom-color: #7C3AED;
        }
        .p3 {
            top: 5px;
            right: 15%;
            transform: rotate(30deg);
            border-bottom-color: #7C3AED;
        }
        .p4 {
            top: 20px;
            left: 5%;
            transform: rotate(-50deg);
            border-bottom-color: #6D28D9;
        }
        .p5 {
            top: 20px;
            right: 5%;
            transform: rotate(50deg);
            border-bottom-color: #6D28D9;
        }

        .crystal-base {
            position: absol
